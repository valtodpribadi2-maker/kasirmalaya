<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidak ada koneksi</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0F2E37; color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  p  { margin: 0 0 24px; color: #b9cbd0; max-width: 28rem; line-height: 1.5; }
  button {
    background: #F5B942; color: #0F2E37; border: 0; border-radius: 12px;
    padding: 14px 32px; font-size: 1rem; font-weight: 600;
  }
  button:active { opacity: .8; }
</style>
</head>
<body>
  <h1>Tidak bisa terhubung</h1>
  <p>Kasir butuh internet. Cek WiFi atau data seluler, lalu coba lagi.</p>
  <button onclick="if (window.App) { App.retry(); } else { history.back(); }">Coba lagi</button>
</body>
</html>
